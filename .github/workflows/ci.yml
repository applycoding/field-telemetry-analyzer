# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.16"
      - run: pip install --require-hashes -r requirements-dev.lock.txt
      - run: pip install -e .
      - run: ruff check
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.16"
      - run: pip install --require-hashes -r requirements-dev.lock.txt
      - run: pip install -e .
      - run: pytest
      - run: python tool/notice_check.py
      - run: python tool/spdx_check.py
  mutants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.16"
      - run: pip install --require-hashes -r requirements-dev.lock.txt
      - run: pip install -e .
      - run: tool/mutants.sh
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.16"
      - run: pip install --require-hashes -r requirements-dev.lock.txt
      - run: pip install -e .
      - run: |
          mkdir -p site
          fta generate --scenario standard --seed 20261110 --out run
          fta detect --log run --out run-out
          fta score --log run --truth run/ground_truth.json --flags run-out/flags.csv --out run-out/score.json --gate
          fta report --log run --flags run-out/flags.csv --score run-out/score.json --out site --truth run/ground_truth.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pages-site
          path: site
  e2e:
    runs-on: ubuntu-24.04
    needs: report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.16"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pages-site
          path: site-out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.2"
      - run: npm ci
      - run: npx playwright install chromium
      - run: FTA_SITE_DIR=site-out npm run test:e2e
